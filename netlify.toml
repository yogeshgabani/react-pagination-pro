# Netlify deploys the demo site (demo/), not the npm package. The demo imports
# the library straight from src/ via the alias in vite.config.ts, so no tsup
# build is needed first.
[build]
  command = "npm run demo:build"
  publish = "demo/dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys count into their own namespace so QA visits
# don't inflate the production hit/visitor cards. Real env vars take priority
# over demo/.env in Vite, so these override it.
[context.deploy-preview.environment]
  VITE_COUNTER_NAMESPACE = "react-next-pagination-pro-preview"

[context.branch-deploy.environment]
  VITE_COUNTER_NAMESPACE = "react-next-pagination-pro-preview"

# Single-page app: any unknown path falls back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything under /assets, so it is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
